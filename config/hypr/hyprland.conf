# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.local/state/omarchy/current/theme/hyprland.conf

# exec-once = hyprpm reload

# Change your own setup in these files (and overwrite any settings from defaults!)

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# ============================================================================
# Scrolling Layout
# ============================================================================

general {
    layout = scrolling
}
scrolling {
    column_width = 0.98
    fullscreen_on_one_column = true
    focus_fit_method = 0
    follow_focus = 1
    # follow_debounce_ms = 10
    # per_monitor = true
    # wrap_focus = true
}

# ============================================================================
# Apps customization
# ============================================================================

windowrule = tag +video-site, match:class (chrome-www.primevideo.com__-Default)
windowrule = tag -chromium-based-browser, match:tag video-site
windowrule = tag -default-opacity, match:tag video-site


# Zen Browser File Upload & Save Dialogs
windowrule = tag +floating-window, match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Upload File.*|File Upload.*)

# # Only a subtle opacity change, but not for video sites
windowrule = opacity 1.0 1.0, match:tag video-site

# ============================================================================
# Workspace naming with Chinese numerals
# ============================================================================
workspace = 1, name:一, monitor:, default:true
workspace = 2, name:二, monitor:, default:false
workspace = 3, name:三, monitor:, default:false
workspace = 4, name:四, monitor:, default:false
workspace = 5, name:五, monitor:, default:false
workspace = 6, name:六, monitor:, default:false
workspace = 7, name:七, monitor:, default:false
workspace = 8, name:八, monitor:, default:false
workspace = 9, name:九, monitor:, default:false
workspace = 10, name:十, monitor:, default:false
# workspace = 11, name:十一, monitor:, default:false
workspace = aaa, name:aaa, monitor:, default:false
workspace = 12, name:十二, monitor:, default:false
workspace = 13, name:十三, monitor:, default:false
workspace = 14, name:十四, monitor:, default:false
workspace = 15, name:十五, monitor:, default:false
workspace = 16, name:十六, monitor:, default:false
workspace = 17, name:十七, monitor:, default:false
workspace = 18, name:十八, monitor:, default:false
workspace = 19, name:十九, monitor:, default:false
workspace = 20, name:二十, monitor:, default:false


animations {
    # stacks the workspace vertically so they match our vertical 3 finger swipe gesture
    # speed = 0.00001 for instant switching then using the keyboard shortcuts
    animation = workspaces, 1, 0.00001, default, slidevert
    animation = specialWorkspace, 0.00001, 6, default, slidevert
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#cursor
cursor {
    hide_on_key_press = true
    # don't warp unless the workspace is in another screen
    warp_on_change_workspace = 0
}

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
