# Extra autostart processes
# exec-once = uwsm-app -- my-service

# User-level lid close monitor - suspends even when docked
exec-once = ~/.config/omarchy/lid-monitor.sh

# Persist clipboard contents across window closures
exec_once = wl-clip-persist --clipboard regular --all-mime-type-regex '(?i)^(?!image/x-inkscape-svg).+'
